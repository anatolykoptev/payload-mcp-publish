name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Publish this existing release tag (a retry after a failed publish), e.g. v0.1.0
        required: false
        type: string

permissions: {}

jobs:
  release-please:
    # Release automation is for the public repository only: npm provenance requires a public
    # source repository and a GitHub-hosted runner. Skipped while the repository is private.
    if: ${{ github.event.repository.private == false && inputs.tag == '' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # A krolik-release-bot (GitHub App) token, not GITHUB_TOKEN: a pull request opened with GITHUB_TOKEN starts no
      # `pull_request` workflow, so the release PR would never get its required checks and could not merge.
      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # A new release, or a retry of an existing tag. Never while private.
    if: ${{ !cancelled() && github.event.repository.private == false && (needs.release-please.outputs.release_created == 'true' || inputs.tag != '') }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      # Build the tagged revision, not whatever commit triggered this run: release-please can tag a
      # newer release merge than the push that started the workflow, and a manual dispatch can start
      # from any branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Fully qualified, so a branch that happens to share the tag's name can never be built instead.
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: The tag matches package.json
        run: test "$TAG" = "v$(node -p "require('./package.json').version")"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.1
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: make preflight
      # First publish: trusted publishing can only be configured for a package that already exists on npm. Publish the first
      # version once by hand with a short-lived token (`npm publish --access public`), then add this workflow file as the
      # trusted publisher on the package's npm access page. From then on no token is involved.
      # Every release goes to `latest`: merging the release PR is the whole release, nothing manual.
      # Trusted publishing (OIDC, `id-token: write` above): npm trusts this workflow file of this
      # repository, configured on the package's npm page; no token is stored anywhere. A
      # NODE_AUTH_TOKEN here would win over OIDC, so there is none.
      - run: npm publish --provenance --access public
